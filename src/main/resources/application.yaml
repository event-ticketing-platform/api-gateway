server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/bookings/**,/api/users/*/bookings
              filters:
                - StripPrefix=1
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
            - id: ticketing-service
              uri: ${TICKETING_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/tickets/**,/api/ticket-types/**,/api/events/*/tickettypes
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://localhost:8081}
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8090}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
  ticketing:
    base-url: ${TICKETING_SERVICE_URL:http://localhost:8091}
